# Cross-asset neural network: GRU per coin + attention across coins
# Usage: python -m cryptoforecast.train --config configs/crossasset.yaml

name: crossasset

data:
  data_dir: data

features:
  return_windows: [1, 5, 15, 60]
  vol_windows: [15, 60]
  leader_windows: [1, 3, 5]
  use_cross_asset: true
  ffill_limit: 30

train:
  model: crossasset
  n_folds: 3
  valid_minutes: 10080
  gap_minutes: 60
  warmup_minutes: 3750
  output_dir: artifacts

nn_params:
  lookback: 30          # minutes of history per coin
  hidden: 64
  n_heads: 4
  n_layers: 2           # attention layers over the asset axis
  dropout: 0.1
  lr: 0.001
  batch_size: 256
  max_epochs: 12
  patience: 2
  # Consecutive minutes have heavily overlapping 15-minute targets, so
  # sampling every 4th minute loses little and quarters the epoch cost
  train_stride: 4
